      summary: Получение темы
      tags:
      - themes
    patch:
      consumes:
      - application/json
      description: |-
        Изменение информации об уже существующем в системе теме
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано**: `"description"` игнорируется, значение в БД не меняется
        2. **Явно передано значение**: `"description": "Пойти на  тренировку"` - устанавливает новое описание в БД
        3. **Передан null**: `"description": null` - очищает поле в БД (set to NULL)
        Ограничение: `title` и `subject` не может быть выставлен как null
      parameters:
      - description: ID изменяемой темы
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTheme тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_themes_transport_http.PatchThemeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное изменение темы
          schema:
            $ref: '#/definitions/internal_features_themes_transport_http.PatchThemeResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_LayMan011_Golang-My-Study_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Theme not found
