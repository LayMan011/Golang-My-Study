services:
    progress:
        build:
            context: ${PROJECT_ROOT}
            dockerfile: ${PROJECT_ROOT}/cmd/learning_progress/Dockerfile
        container_name: progress
        environment:
         - HTTP_ADDR=:5050
         - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
         - POSTGRES_HOST=project-postgres
         - POSTGRES_USER=${POSTGRES_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
         - POSTGRES_DB=${POSTGRES_DB}
         - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
         - LOGGER_LEVEL=${LOGGER_LEVEL}
         - TIME_ZONE=${TIME_ZONE}
         - LOGGER_FOLDER=/app/out/logs
        volumes:
         - ${PROJECT_ROOT}/out/logs:/app/out/logs
        ports:
         - "5050:5050"
        restart: always

    project-postgres:
        image: postgres:18.1-bookworm
        container_name: project-postgres
        environment:
         - POSTGRES_USER=${POSTGRES_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
         - POSTGRES_DB=${POSTGRES_DB}
        volumes:
         - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
        restart: always 

    project-redis:
        image: redis:7-alpine
        container_name: project-redis
        ports:
        - "6379:6379"
        volumes:
        - redis-data:/data
        command: redis-server --requirepass my_secure_password
        restart: unless-stopped
    
    project-postgres-migrate:
        image: migrate/migrate:v4.19.1
        volumes:
         - ${PROJECT_ROOT}/migrations:/migrations
    
    port-forwarder:
        image: alpine/socat:1.8.0.3
        container_name: project-postgres-port-forwarder
        command: tcp-listen:5432,fork,reuseaddr tcp-connect:project-postgres:5432
        ports:
         - "127.0.0.1:5432:5432"

    swagger:
        build:
         context: ${PROJECT_ROOT}
         dockerfile_inline: |
            FROM golang:1.26.4-alpine
            RUN apk add --no-cache git
            RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
            WORKDIR /code
            ENTRYPOINT ["swag"]
        volumes:
         - ${PROJECT_ROOT}:/code

    